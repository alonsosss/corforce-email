rules {
  WHITELIST_FORWARDING_HOST_NO_REJECT {
    action = "add header";
    expression = "WHITELISTED_FWD_HOST";
    require_action = ["reject"];
  }
  WHITELIST_FORWARDING_HOST_NO_GREYLIST {
    action = "no action";
    expression = "WHITELISTED_FWD_HOST";
    require_action = ["greylist", "soft reject"];
  }
  # Ningun mensaje se entrega sin veredicto del antivirus. CLAM_VIRUS_FAIL es el simbolo
  # que el modulo antivirus deja (con puntuacion 0, sin accion propia) cuando el analisis
  # NO se hizo: clamd no responde, agota el plazo, contesta algo que no se entiende o
  # devuelve Heuristics.Limits.Exceeded (clamd.conf, AlertExceedsMax). Sin esta regla el
  # mensaje seguiria su camino como si estuviera limpio. Soft reject da 451 al remitente:
  # Postfix lo conserva en cola y lo reintenta, asi que una parada de clamd aplaza el
  # correo, no lo pierde. Apagar el antivirus a proposito es vaciar antivirus.conf (sin
  # regla no hay simbolo y esta no dispara); SKIP_CLAMD=y por si solo aplaza todo lo que
  # entra, que es lo correcto pero rara vez lo que se busca.
  VIRUS_SCAN_FAILED {
    action = "soft reject";
    expression = "CLAM_VIRUS_FAIL";
    message = "Antivirus scan could not be completed, please retry later";
  }
}
