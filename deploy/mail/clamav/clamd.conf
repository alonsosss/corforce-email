#Debug true
#LogFile /dev/null
LogTime yes
LogClean yes
ExtendedDetectionInfo yes
PidFile /run/clamav/clamd.pid
OfficialDatabaseOnly no
LocalSocket /run/clamav/clamd.sock
TCPSocket 3310
# Mayor flujo INSTREAM que clamd acepta. Cubre message_size_limit de Postfix (100 MiB) mas
# 1 MiB, porque Rspamd manda el mensaje ENTERO (antivirus.conf, scan_mime_parts = false) y
# el webmail manda cada adjunto. Pasado el tope clamd responde "INSTREAM size limit
# exceeded. ERROR" y, con flujos bastante mayores, corta la conexion a medias: en los dos
# casos el mensaje se queda sin veredicto. ops/scaffold/check-mail-size-limits.sh lo ata a
# Postfix, a max_size de Rspamd y a los topes del webmail.
StreamMaxLength 101M
MaxThreads 10
ReadTimeout 10
CommandReadTimeout 3
SendBufTimeout 200
MaxQueue 80
IdleTimeout 20
SelfCheck 3600
User clamav
Foreground yes
DetectPUA yes
# See https://github.com/vrtadmin/clamav-faq/blob/master/faq/faq-pua.md
#ExcludePUA NetTool
#ExcludePUA PWTool
#IncludePUA Spy
#IncludePUA Scanner
#IncludePUA RAT
HeuristicAlerts yes
ScanOLE2 yes
AlertOLE2Macros no
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
PhishingSignatures no
PhishingScanURLs no
HeuristicScanPrecedence yes
ScanHTML yes
ScanArchive yes
# MaxFileSize cubre el mismo mensaje entero que StreamMaxLength y MaxScanSize deja el doble
# para lo que se extrae de un adjunto comprimido. Importa tanto como StreamMaxLength: con un
# MaxFileSize por debajo del flujo, clamd lo analiza truncado y responde "stream: OK", un
# veredicto limpio FALSO (comprobado con la imagen de deploy/mail/clamav: 30 y 60 MiB con
# EICAR al final dan OK con MaxFileSize 25M). AlertExceedsMax lo convierte en la deteccion
# Heuristics.Limits.Exceeded.*, que clamav.lua traduce a CLAM_VIRUS_FAIL y force_actions.conf
# a soft reject: un analisis recortado nunca pasa por limpio.
MaxScanSize 202M
MaxFileSize 101M
AlertExceedsMax yes
MaxRecursion 5
MaxFiles 200
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 1000
ConcurrentDatabaseReload no
