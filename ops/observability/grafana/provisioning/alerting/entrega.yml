# Entrega de las alertas de Prometheus: Prometheus las envia al Alertmanager de Grafana
# (prometheus.yml, bloque alerting) y este las manda por correo. El destinatario sale de
# ALERT_EMAIL_TO y el remitente y el SMTP de GF_SMTP_* (docker-compose.observability.yml).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: operadores
    receivers:
      - uid: correo-operadores
        type: email
        settings:
          addresses: $__env{ALERT_EMAIL_TO}
          singleEmail: true

policies:
  - orgId: 1
    receiver: operadores
    group_by: ["alertname", "instance"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
