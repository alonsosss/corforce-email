# Servidor de la aplicacion web. Las cabeceras de seguridad (CSP con nonce, X-Frame-Options,
# nosniff, Referrer-Policy) las pone el gateway, que ademas borra las que vengan de aqui:
# no se duplican para no acabar con dos politicas.
#
# La cache se decide por el NOMBRE del fichero: lo que lleva hash de contenido es inmutable;
# lo que no, se revalida o no se guarda.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # El documento lo pide el gateway sin comprimir (Accept-Encoding: identity) para poder
    # estampar el nonce; los assets si viajan comprimidos.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El documento nunca se cachea: es el que decide que chunks con hash se piden.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Sello del build (lo genera el Dockerfile): delata una pestana con una version vieja.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Aplicacion instalable (PWA). El service worker y el manifiesto no llevan hash: se revalidan
    # siempre para que un despliegue los actualice. El service worker solo guarda la carcasa
    # estatica, nunca /api ni el documento (web/public/sw.js).
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Ficheros con hash de contenido en el nombre (Vite: nombre-<hash>.ext). Un build nuevo
    # produce otro nombre, asi que cachearlos un ano no puede servir codigo viejo. Si no
    # existen, 404: devolver index.html a un chunk viejo lo romperia con un tipo MIME falso.
    location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Todo lo demas (favicon y rutas de la SPA): las rutas caen en index.html, que se
    # sirve con no-store por su propia regla.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
