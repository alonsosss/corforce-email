# Actualizaciones de dependencias con la cadencia justa para que se lean y no se ignoren.
#
# govulncheck en el CI ya corta lo EXPLOTABLE del codigo Go; esto cubre lo que no ve, en
# Go y en la aplicacion web: una version con arreglo de seguridad que aun no tiene CVE publicado, y la deuda de
# ir quedandose atras hasta que actualizar sea una migracion. Semanal y agrupado por
# ecosistema: un PR por semana y familia, no uno por paquete. Los mayores (major) no se
# agrupan a proposito: cada uno merece leerse solo.
#
# Sin entrada docker: todas las imagenes Go comparten la misma imagen golang y la version
# de Go la gobierna go.mod, que si se vigila aqui (al subirla, subir tambien los Dockerfile,
# la plantilla de make new-service y el go-version de CI).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Lima }
    open-pull-requests-limit: 3
    groups:
      go-menores:
        update-types: [minor, patch]
    labels: [dependencias, go]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Lima }
    open-pull-requests-limit: 3
    groups:
      web-menores:
        update-types: [minor, patch]
    labels: [dependencias, web]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencias, ci]

