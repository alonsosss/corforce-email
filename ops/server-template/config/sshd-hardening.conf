# Core Force - endurecimiento SSH (drop-in de /etc/ssh/sshd_config.d/)
# Aplicado por ops/server-template/bootstrap.sh.
# El bootstrap pone PasswordAuthentication en "yes" automaticamente si no detecta
# ninguna llave instalada, para evitar dejar el servidor sin acceso.

PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
