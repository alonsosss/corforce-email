volumes:
  pgdata:
  redisdata:
  natsdata:

networks:
  mail-internal:
    driver: bridge
  # Red de los motores de correo: la crea deploy/mail/docker-compose.mail.yml. Aqui solo
  # se unen los servicios que los motores llaman por nombre (mail-auth, mail-policy).
  mail-engines:
    external: true
    name: ${MAIL_ENGINES_NETWORK:-mail-engines}
  # Red del ejecutor de migraciones (la crea deploy/mail/docker-compose.mail.yml): Dovecot, mail-migration y
  # mail-migration-runner, nada mas. mail-migration se une para servir al ejecutor su API.
  mail-migration:
    external: true
    name: ${MAIL_MIGRATION_NETWORK:-mail-migration}
