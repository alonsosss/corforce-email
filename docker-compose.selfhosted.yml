# compose-base: docker-compose.yml
#
# Perfil de PRODUCCION AUTOALOJADA: la plataforma entera en un servidor propio, sin RDS, sin
# ElastiCache y sin balanceador. Da con contenedores los controles que en AWS dan esos servicios
# gestionados, sin relajar ninguno de los que exige ENVIRONMENT=production:
#   - el Postgres del contenedor (el de embedded-db, aqui siempre activo) con TLS 1.2 minimo y
#     toda conexion TCP cifrada (pg_hba);
#   - PgBouncer hacia Postgres con verify-full contra la CA interna;
#   - Redis solo por TLS y con contrasena, y los servicios Go con REDIS_TLS=true y esa CA;
#   - mail-auth con un certificado de esa CA, que el webmail verifica;
#   - un proxy de borde que termina HTTPS de la web publica delante del gateway.
#
# Se activa declarando DEPLOY_PROFILE=selfhosted en el .env del servidor: los despliegues
# (scripts/deploy-ecr.sh y release.yml) toman los argumentos de compose de
# ops/maintenance/perfil-despliegue.sh. A mano, siempre por el envoltorio de secretos:
#   ops/security/secrets/with-secrets.sh docker compose -f docker-compose.yml \
#     -f docker-compose.selfhosted.yml up -d <servicios>
#
# Requisitos previos: el TLS interno en INTERNAL_TLS_DIR (ops/security/internal-tls.sh) y el
# volumen de certificados de acme de deploy/mail. Orden completo en docs/Operacion_Despliegue.md,
# seccion 11. Los puntos de montaje /run/core-force-mail/tls/* los usa tambien internal-tls.sh y
# ops/scaffold/check-selfhosted-profile.sh comprueba que coinciden.

x-internal-ca: &internal-ca
  - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/publico:/run/core-force-mail/tls/publico:ro

# Lo que cambia en todo servicio Go. REDIS_TLS* pisan lo que diga el .env: en este perfil no hay
# Redis en claro. POSTGRES_DIRECT_*: las migraciones van a Postgres sin pasar por PgBouncer (sus
# advisory locks de sesion no sobreviven al modo transaction), y ahi negocian TLS.
# En este servidor la plataforma tiene que volver sola tras un reinicio. Docker corre con
# live-restore (ops/server-template/config/daemon.json): al arrancar el demonio levanta los
# contenedores con la politica "always", no los "unless-stopped" del compose base. Comprobado en el
# servidor real: tras reiniciar, los motores (always) volvieron y postgres-primary no, y con el la
# plataforma entera se quedo reintentando. El perfil la fija para todos sus servicios.
x-reinicio: &reinicio always

# Endurecimiento de todo servicio Go: sin root, sistema de ficheros de solo lectura (ninguno escribe: las
# imagenes son scratch y el codigo no crea ficheros), sin capacidades y con un tope de procesos. Cada servicio
# declara ademas su mem_limit y su GOMEMLIMIT (80 % del techo, para que el recolector actue antes que el
# OOM del cgroup). Son techos, no reservas: se dimensionan contra lo medido en reposo (6 a 15 MiB por
# servicio) y la carga maxima de cada uno; el presupuesto del servidor esta en docs/Operacion_Despliegue.md
# ("Presupuesto de recursos"). check-selfhosted-profile.sh falla si un servicio Go pierde alguno.
x-go-runtime: &go-runtime
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  pids_limit: 256
  # pkg/server espera hasta 30 s a las peticiones en vuelo tras SIGTERM; con los 10 s por defecto de compose
  # el kernel las mataba a medias en cada despliegue.
  stop_grace_period: 40s

x-go-service-env: &go-service-env
  REDIS_TLS: "true"
  REDIS_TLS_CA_FILE: /run/core-force-mail/tls/publico/ca.crt
  REDIS_TLS_SERVER_NAME: redis
  POSTGRES_DIRECT_HOST: postgres-primary
  POSTGRES_DIRECT_PORT: "5432"

services:
  postgres-primary:
    restart: *reinicio
    # En este perfil la base es siempre la del contenedor: sin el perfil embedded-db que la deja
    # fuera en AWS (y PgBouncer puede esperar a que este sana).
    profiles: !reset []
    # docker-compose.yml fija ya los parametros de memoria y planificador: se repiten tal cual
    # (command no se fusiona) y se anade el TLS. check-selfhosted-profile.sh falla si divergen.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/core-force-mail/tls/postgres/server.crt
      - -c
      - ssl_key_file=/run/core-force-mail/tls/postgres/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/core-force-mail/postgres/pg_hba.conf
    volumes:
      - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/postgres:/run/core-force-mail/tls/postgres:ro
      - ./selfhosted/postgres:/etc/core-force-mail/postgres:ro

  pgbouncer:
    restart: *reinicio
    # Medido en reposo: 2,5 MiB. Con max_client_conn 4000, unos KiB por cliente en espera.
    mem_limit: 128m
    environment:
      DB_UPSTREAM_HOST: postgres-primary
      DB_UPSTREAM_PORT: "5432"
      DB_UPSTREAM_SSLMODE: verify-full
      DB_UPSTREAM_CA_FILE: /run/core-force-mail/tls/publico/ca.crt
      # Dovecot mantiene conexiones largas por PgBouncer: con el corte de ociosos (600 s por
      # defecto) el primer inicio de sesion tras un rato sin uso fallaba con client_idle_timeout.
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: "0"
    volumes: *internal-ca
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      # Los motores de correo (deploy/mail) leen el directorio de la celda por PgBouncer
      # (MAIL_DB_HOST=postgres), como los servicios: Postgres no entra en la red de los motores,
      # donde corren los analizadores de contenido hostil (rspamd, clamd, olefy).
      mail-engines:
        aliases:
          - postgres

  redis:
    restart: *reinicio
    # maxmemory 512mb mas el margen de la copia al reescribir el AOF y de los buffers de clientes.
    # Medido en reposo: 4 MiB.
    mem_limit: 640m
    # Sin puerto en claro (--port 0): el 6379 es TLS. La contrasena entra por la entrada estandar
    # (selfhosted/redis/entrypoint.sh), no por argumentos. Los parametros de memoria son los de
    # docker-compose.yml; check-selfhosted-profile.sh falla si divergen.
    entrypoint: ["/etc/core-force-mail/redis/entrypoint.sh"]
    command:
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --hz
      - "20"
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/core-force-mail/tls/redis/server.crt
      - --tls-key-file
      - /run/core-force-mail/tls/redis/server.key
      - --tls-ca-cert-file
      - /run/core-force-mail/tls/publico/ca.crt
      - --tls-auth-clients
      - "no"
      - --tls-protocols
      - TLSv1.2 TLSv1.3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/redis:/run/core-force-mail/tls/redis:ro
      - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/publico:/run/core-force-mail/tls/publico:ro
      - ./selfhosted/redis:/etc/core-force-mail/redis:ro
    healthcheck:
      # REDISCLI_AUTH y no -a: la contrasena no aparece en la lista de procesos.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --tls --cacert /run/core-force-mail/tls/publico/ca.crt -h 127.0.0.1 -p 6379 ping | grep -q PONG"]

  gateway:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
      # El gateway acepta X-Real-IP solo de la red edge, donde no hay mas que el proxy de borde.
      TRUSTED_PROXY_CIDRS: ${EDGE_NETWORK_SUBNET:-172.31.255.0/28}
      # Almacen de objetos del perfil (servicio minio, mas abajo): /media/public/* lo lee de ahi. El
      # bucket (MINIO_BUCKET) es del .env y las claves del almacen de secretos (docker-compose.yml).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes: *internal-ca
    networks:
      edge: {}

  identity:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  access-control:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  organization:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  audit:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
    volumes: *internal-ca
  scheduler:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  observability:
    restart: *reinicio
    <<: *go-runtime
    # Una consulta lee como mucho 4 MiB de Loki (500 lineas); el techo cubre varias a la vez.
    mem_limit: 96m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 75MiB
      # La pila de observabilidad corre en este servidor (docker-compose.observability.yml, red compartida):
      # Loki se alcanza por su nombre de servicio y nunca publica puerto.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes: *internal-ca
  mail-directory:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
      # Antes de admitir enforce en la politica MTA-STS de un dominio comprueba sus MX en el DNS
      # PUBLICO, como domain-service (mas abajo): el resolver del proveedor cachea las respuestas
      # negativas. Sobrescribible con MAIL_DNS_RESOLVER.
      MAIL_DNS_RESOLVER: ${MAIL_DNS_RESOLVER:-1.1.1.1:53}
    volumes: *internal-ca
  mail-auth:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    # Sin root (la imagen es scratch y no fija usuario). Este user: es tambien el dueno de su clave
    # TLS: internal-tls.sh lo lee de aqui.
    user: "65532:65532"
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
      # Certificado de la CA interna para el listener de Dovecot y del webmail (9082), con SAN
      # mail-auth, el host de MAIL_AUTH_URL. Lo relee solo cuando internal-tls.sh lo renueva.
      MAIL_AUTH_TLS_CERT: /run/core-force-mail/tls/mail-auth/server.crt
      MAIL_AUTH_TLS_KEY: /run/core-force-mail/tls/mail-auth/server.key
    volumes:
      - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/publico:/run/core-force-mail/tls/publico:ro
      - ${INTERNAL_TLS_DIR:-/opt/core-force-mail/tls}/mail-auth:/run/core-force-mail/tls/mail-auth:ro
  mail-security:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 384m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 300MiB
    volumes: *internal-ca
  webmail:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 512m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 400MiB
      # Verifica mail-auth con la CA interna; se anade a las raices del sistema, con las que sigue
      # verificando el certificado publico de Dovecot y Postfix.
      WEBMAIL_TLS_CA_FILE: /run/core-force-mail/tls/publico/ca.crt
    volumes: *internal-ca
  domain-service:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
      # La verificacion de DNS de los dominios de las empresas consulta el DNS PUBLICO. El resolver
      # del servidor es el del proveedor, que guarda en cache que "no hay registros" y devolvia un
      # dominio recien publicado como fallido durante horas (2026-09-19: los cinco registros
      # visibles en 1.1.1.1 y la plataforma sin verlos). Sobrescribible con MAIL_DNS_RESOLVER.
      MAIL_DNS_RESOLVER: ${MAIL_DNS_RESOLVER:-1.1.1.1:53}
    volumes: *internal-ca
  mail-migration:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
    volumes: *internal-ca
  mail-dav:
    restart: *reinicio
    <<: *go-runtime
    # Un listado inicial o un sync-collection completo materializa los eventos del calendario (medido:
    # 20000 eventos de 350 bytes, +22 MiB), y el tope por buzon (MAIL_DAV_MAX_EVENTS_PER_MAILBOX) los deja crecer.
    mem_limit: 256m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 200MiB
      # Verifica mail-auth (certificado de la CA interna) al autenticar cada peticion.
      MAIL_DAV_TLS_CA_FILE: /run/core-force-mail/tls/publico/ca.crt
    volumes: *internal-ca
  transactional:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
    volumes: *internal-ca
  suppression:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  templates:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  contacts:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 256m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 200MiB
    volumes: *internal-ca
  billing:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  reputation:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  campaigns:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 192m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 150MiB
    volumes: *internal-ca
  automations:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca
  analytics:
    restart: *reinicio
    <<: *go-runtime
    mem_limit: 128m
    environment:
      <<: *go-service-env
      GOMEMLIMIT: 100MiB
    volumes: *internal-ca

  # nats y web no necesitan nada mas del perfil, pero si su politica de reinicio: sin ella no
  # vuelven tras un reinicio del servidor (live-restore).
  nats:
    restart: *reinicio
    # JetStream escribe en disco (el cache de paginas del kernel no cuenta aqui). Medido en reposo: 13 MiB.
    mem_limit: 256m
  web:
    restart: *reinicio
    mem_limit: 64m

  # Almacen de objetos (docs/adr/0012): las imagenes de las plantillas. Solo en la red interna y sin
  # puerto en el host ni en el borde: nadie de fuera habla con MinIO, el gateway lee de el y sirve
  # /media/public/*. Sin consola (MINIO_BROWSER=off). La cuenta raiz la reciben solo minio y
  # minio-init; gateway y templates usan el usuario de servicio que crea minio-init, acotado a
  # MINIO_BUCKET. Una sola imagen, fijada por digest, para los tres contenedores (trae mc y curl).
  # El volumen entra en el respaldo (ops/backup/backup-mail-volumes.sh) y solo sale cifrado.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    restart: *reinicio
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # Medido en reposo: 47 a 52 MiB. Las subidas son de hasta 5 MiB (POST /assets de templates).
    mem_limit: 192m
    entrypoint: ["/etc/core-force-mail/minio/entrypoint.sh"]
    command: ["server", "/data", "--address", ":9000", "--certs-dir", "/tmp/certs"]
    environment:
      TZ: ${TZ:-America/Lima}
      GOMEMLIMIT: 150MiB
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
      - ./selfhosted/minio:/etc/core-force-mail/minio:ro
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      minio-volumen:
        condition: service_completed_successfully
    networks:
      - mail-internal

  # Un volumen nuevo hereda el /data de la imagen, de root: MinIO, sin root, no podria escribir. Este
  # trabajo le da el directorio raiz al uid de minio y sale; con el volumen ya suyo no toca nada.
  minio-volumen:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    mem_limit: 32m
    entrypoint: ["/bin/sh", "-c"]
    command: ['[ "$$(stat -c %u:%g /data)" = 10001:10001 ] || chown 10001:10001 /data']
    volumes:
      - minio-data:/data

  # Inicializacion idempotente (selfhosted/minio/init.sh): bucket MINIO_BUCKET privado, politica
  # acotada a el y usuario de servicio MINIO_ACCESS_KEY. Corre en cada despliegue tras minio sano
  # (ops/maintenance/perfil-despliegue.sh --infra) y sale; esperar-sanos.sh exige que salga con 0.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    # mc supera los 64 MiB al adjuntar la politica (medido: el OOM del cgroup lo mata con 64 MiB y
    # termina con 96); 128 deja margen.
    mem_limit: 128m
    entrypoint: ["/etc/core-force-mail/minio/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
    volumes:
      - ./selfhosted/minio:/etc/core-force-mail/minio:ro
    tmpfs:
      - /tmp:size=4m
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mail-internal

  edge-proxy:
    # Proxy de borde: HTTPS de la web publica con el certificado que emite acme (volumen ssl de
    # deploy/mail), 80 redirige a 443, y al gateway por la red edge. Configuracion en
    # selfhosted/edge. Fijada por digest: esta en el camino de toda peticion de internet.
    image: nginx:1.30.5-alpine@sha256:25820c39dba41369486df729ad6697de2fab631ca809e0503e1d1e0c73d9a232
    init: true
    read_only: true
    cap_drop: [ALL]
    # El maestro arranca como root para leer la clave de acme (0600 de root) y abrir 80 y 443, y
    # baja los trabajadores al usuario nginx.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    environment:
      TZ: ${TZ:-America/Lima}
      # Host publico de la web: el de PUBLIC_BASE_URL salvo EDGE_PUBLIC_HOST.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EDGE_PUBLIC_HOST: ${EDGE_PUBLIC_HOST:-}
      EDGE_UPSTREAM: gateway:${GATEWAY_PORT:-8080}
      EDGE_TLS_CERT_FILE: ${EDGE_TLS_CERT_FILE:-/etc/ssl/mail/cert.pem}
      EDGE_TLS_KEY_FILE: ${EDGE_TLS_KEY_FILE:-/etc/ssl/mail/key.pem}
      EDGE_MAX_BODY_SIZE: ${EDGE_MAX_BODY_SIZE:-101m}
      EDGE_HSTS_MAX_AGE: ${EDGE_HSTS_MAX_AGE:-31536000}
      EDGE_REQUIRE_CLOUDFLARE: ${EDGE_REQUIRE_CLOUDFLARE:-true}
      EDGE_CERT_CHECK_INTERVAL: ${EDGE_CERT_CHECK_INTERVAL:-3600}
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./selfhosted/edge:/etc/core-force-mail/edge:ro
      - ./selfhosted/edge/entrypoint.d:/docker-entrypoint.d:ro
      - mail-ssl:/etc/ssl/mail:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /run:size=1m
      - /tmp:size=1m
      # Cuerpos de peticion en curso que no caben en memoria (client_body_temp_path): en RAM y
      # nunca en disco. Cuenta dentro del limite de memoria del contenedor.
      - /var/cache/nginx:size=${EDGE_BODY_TMPFS_SIZE:-256m}
    mem_limit: ${EDGE_MEMORY_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      gateway:
        condition: service_started
    restart: *reinicio
    security_opt: ["no-new-privileges:true"]
    networks:
      - edge

volumes:
  # Certificados publicos de acme (deploy/mail/docker-compose.mail.yml, volumen ssl-vol del
  # proyecto de los motores).
  mail-ssl:
    external: true
    name: ${MAIL_SSL_VOLUME:-mail_ssl-vol}
  # Objetos de MinIO (servicio minio). Con nombre del proyecto (app_minio-data): el respaldo lo busca asi.
  minio-data:

networks:
  # Solo el proxy de borde y el gateway. Subred fija: es la que el gateway declara de confianza
  # (TRUSTED_PROXY_CIDRS). Fuera del pool de redes de Docker del servidor
  # (ops/server-template/config/daemon.json, 172.30.0.0/16) para no chocar con una red nueva.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_SUBNET:-172.31.255.0/28}
