# Origen de registros. Se aprovisiona como codigo por lo mismo que el de metricas: un
# origen configurado a mano se pierde al recrear el contenedor y nadie se entera hasta que
# lo necesita.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Sin multi-tenancy: auth_enabled esta en false en Loki porque el unico que llega es
      # Grafana, por la red interna, y Grafana ya exige contrasena.
      maxLines: 2000
