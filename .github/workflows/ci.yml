name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -race -count=1

      # Sin restos de las dos bases de las que nace el repositorio (plataforma de referencia y
      # capa PHP/MySQL de mailcow): un termino de esos en el codigo es una suposicion de
      # otro producto que falla en silencio.
      - name: Copia limpia
        run: make clean-copy

      - name: Validar consistencia (puertos, modulos gateados, acoplamiento, streams, imagenes)
        run: bash ops/scaffold/validate.sh

      - name: Migraciones idempotentes (empresa, celda y registro)
        run: make check-migrations

      - name: Migraciones que dicen reemplazar y no reemplazan
        run: make check-migration-drops

      - name: Fallos sin rastro (500 mudos)
        run: bash ops/scaffold/check-silent-errors.sh

      - name: Contratos de eventos (payload por subject)
        run: go run ./ops/scaffold/eventcontracts -check

      - name: Secretos fuera del repositorio
        run: make check-secrets

      - name: Secretos por el resolvedor comun
        run: make check-secret-sources

      - name: Cada contenedor recibe solo sus secretos
        run: make check-secret-scope

      - name: Objetivos de monitoreo al dia
        run: make check-observability-targets

      - name: Override de imagenes ECR al dia
        run: make check-compose-images

      - name: Mapa ruta->servicio al dia
        run: make check-service-paths

      - name: Reglas de alerta (pruebas de promtool)
        run: bash ops/observability/check-alertas.sh

      - name: Vulnerabilidades alcanzables (Go)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Registro de eventos al dia (sin drift)
        run: |
          bash ops/scaffold/gen-events.sh
          git diff --quiet -- docs/arquitectura/EVENTS.md || \
            ( echo "docs/arquitectura/EVENTS.md desactualizado: corre 'make gen-events'" >&2; \
              git --no-pager diff -- docs/arquitectura/EVENTS.md; exit 1 )

  e2e:
    name: Punta a punta (binarios reales, Postgres, NATS y Redis desechables)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: make e2e
        run: make e2e

  # Pruebas //go:build integration contra Postgres y Redis reales. services: levanta los
  # contenedores; ops/scaffold/test-integration.sh les cambia la credencial por una
  # aleatoria de la ejecucion, crea una base por paquete, corre los paquetes en serie y
  # falla si una prueba falla o se salta (INTEGRATION_REQUIRED=1).
  integration:
    name: Integracion (Postgres y Redis reales, una base por paquete)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cfm_it
          POSTGRES_DB: postgres
          # Solo para el arranque: el script la reemplaza por una aleatoria antes de que
          # conecte ninguna prueba.
          POSTGRES_PASSWORD: boot-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 27000:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cfm_it -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 27001:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: make test-integration
        env:
          IT_PG_CONTAINER: ${{ job.services.postgres.id }}
          IT_PG_PORT: '27000'
          IT_PG_USER: cfm_it
          IT_REDIS_CONTAINER: ${{ job.services.redis.id }}
          IT_REDIS_PORT: '27001'
        run: make test-integration
      # El almacen de secretos de produccion, con la imagen de OpenBao fijada por digest.
      - name: make check-openbao
        run: make check-openbao

  web:
    name: Aplicacion web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build

  mail-engines:
    name: Motores de correo (deploy/mail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sintaxis de scripts y compose
        run: |
          set -e
          for f in $(find deploy/mail -name '*.sh'); do bash -n "$f"; done
          for f in $(find deploy/mail -name '*.py'); do python3 -m py_compile "$f"; done
          docker compose -f deploy/mail/docker-compose.mail.yml config -q
