# Acceso a postgres-primary en la produccion autoalojada (docker-compose.selfhosted.yml).
#
# Toda conexion TCP va cifrada: hostssl con scram-sha-256 y hostnossl rechazado, asi que un
# cliente que no negocia TLS no llega ni a autenticarse. Clientes y su modo:
#   - PgBouncer: verify-full contra la CA interna (DB_UPSTREAM_CA_FILE);
#   - organization y las migraciones de empresa por POSTGRES_DIRECT_HOST: sslmode=prefer de
#     pkg/config, que negocia TLS y aqui no puede caer a texto plano;
#   - los guiones del host (ops/db, ops/backup) con psql o pg_dump: libpq, prefer por defecto.
# Los motores de correo (Postfix, Dovecot, acme) no llegan aqui: van por PgBouncer.
#
# Solo redes privadas y bucle local: Postgres no se publica fuera de 127.0.0.1 y sus clientes
# viven en redes de Docker. El socket local no sale del contenedor (lo usan el chequeo de salud y
# la inicializacion de la imagen): quien puede entrar al contenedor ya puede leer los datos.

# TYPE      DATABASE  USER  ADDRESS          METHOD
local       all       all                    trust

hostssl     all       all   127.0.0.0/8      scram-sha-256
hostssl     all       all   10.0.0.0/8       scram-sha-256
hostssl     all       all   172.16.0.0/12    scram-sha-256
hostssl     all       all   192.168.0.0/16   scram-sha-256
hostssl     all       all   ::1/128          scram-sha-256
hostssl     all       all   fc00::/7         scram-sha-256

hostnossl   all       all   0.0.0.0/0        reject
hostnossl   all       all   ::/0             reject
