# Pruebas de la alerta RevocacionEnDovecotFallida.
#
# mail-security retira de Dovecot la credencial de un buzon con cada evento mail.mailbox.*; un fallo
# deja el evento sin confirmar y JetStream lo reentrega cada 90 s. Un fallo suelto que la reentrega
# resuelve no avisa; uno que sigue diez minutos si, con su motivo, y deja de avisar cuando los fallos
# paran (arreglado, o el evento en EVENTS_DLQ tras unos 30 minutos).
#
#   make check-alertas

rule_files:
  - ../rules/plataforma.yml

evaluation_interval: 1m

tests:
  # ── Sin fallos: las series nacen a cero y no se mueven ─────────────────────
  - interval: 1m
    input_series:
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="unreachable"}'
        values: '0x60'
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="rejected"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: RevocacionEnDovecotFallida
        exp_alerts: []

  # ── Un fallo suelto que la reentrega resuelve: no avisa ───────────────────
  - interval: 1m
    input_series:
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="unreachable"}'
        values: '0x10 1x50'
    alert_rule_test:
      - eval_time: 14m
        alertname: RevocacionEnDovecotFallida
        exp_alerts: []
      - eval_time: 22m
        alertname: RevocacionEnDovecotFallida
        exp_alerts: []

  # ── Clave distinta en los dos lados: falla en cada reentrega y avisa ──────
  - interval: 1m
    input_series:
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="rejected"}'
        values: '0x5 1+1x40'
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="unreachable"}'
        values: '0x46'
    alert_rule_test:
      - eval_time: 12m
        alertname: RevocacionEnDovecotFallida
        exp_alerts: []
      - eval_time: 17m
        alertname: RevocacionEnDovecotFallida
        exp_alerts:
          - exp_labels:
              severidad: alta
              service: mail-security
              reason: rejected
            exp_annotations:
              resumen: "mail-security no consigue retirar credenciales de Dovecot (rejected)"
              detalle: "Los buzones apagados, borrados o con la credencial cambiada conservan sus sesiones IMAP y POP3 abiertas y siguen entrando con la credencial vieja hasta que caduca la cache de Dovecot (auth_cache_ttl, 300 s). unreachable: Dovecot o su listener 8443 no responden (contenedor dovecot-mail, red mail-engines, DOVEADM_API_URL). rejected: DOVEADM_API_KEY distinta en Dovecot y en mail-security, una orden fuera de doveadm_allowed_commands o un certificado que no casa con DOVEADM_API_TLS_SERVER_NAME. command: la orden fallo dentro de Dovecot (su registro). directory: la base de la celda no responde. Tras unos 30 minutos el evento pasa a EVENTS_DLQ (dlq.mail.mailbox.*): reproducirlo, o ejecutar en dovecot-mail doveadm auth cache flush y doveadm kick con el buzon que nombra el registro de mail-security (revocacion en Dovecot no aplicada)."

  # ── Dovecot caido y despues de vuelta: avisa mientras falla y cesa al parar ─
  - interval: 1m
    input_series:
      - series: 'mail_security_dovecot_revocation_failures_total{job="mail-services",service="mail-security",reason="unreachable"}'
        values: '0x5 1+1x20 21x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: RevocacionEnDovecotFallida
        exp_alerts:
          - exp_labels:
              severidad: alta
              service: mail-security
              reason: unreachable
            exp_annotations:
              resumen: "mail-security no consigue retirar credenciales de Dovecot (unreachable)"
              detalle: "Los buzones apagados, borrados o con la credencial cambiada conservan sus sesiones IMAP y POP3 abiertas y siguen entrando con la credencial vieja hasta que caduca la cache de Dovecot (auth_cache_ttl, 300 s). unreachable: Dovecot o su listener 8443 no responden (contenedor dovecot-mail, red mail-engines, DOVEADM_API_URL). rejected: DOVEADM_API_KEY distinta en Dovecot y en mail-security, una orden fuera de doveadm_allowed_commands o un certificado que no casa con DOVEADM_API_TLS_SERVER_NAME. command: la orden fallo dentro de Dovecot (su registro). directory: la base de la celda no responde. Tras unos 30 minutos el evento pasa a EVENTS_DLQ (dlq.mail.mailbox.*): reproducirlo, o ejecutar en dovecot-mail doveadm auth cache flush y doveadm kick con el buzon que nombra el registro de mail-security (revocacion en Dovecot no aplicada)."
      - eval_time: 36m
        alertname: RevocacionEnDovecotFallida
        exp_alerts: []
