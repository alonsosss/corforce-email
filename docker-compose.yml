# Despliegue de la plataforma (plano de control). Los motores de correo tienen su propio
# compose en deploy/mail/docker-compose.mail.yml y se levantan aparte, por celda.
#
# Entorno de los servicios: cada uno lee .env (configuracion NO sensible: puertos, hosts,
# URLs) y, si existe, el fichero de secretos que ops/security/secrets/fetch-secrets.sh
# materializa en memoria desde AWS Secrets Manager. En el entorno local ese fichero no
# existe y Compose lo omite (required: false), asi que el desarrollo sigue arrancando solo
# con .env. Ver ops/security/secrets/README.md.
#
# El fichero de secretos llega entero a cada servicio, asi que un secreto de un solo
# servicio se vacia en los demas con `environment:`. La clave de firma del token de acceso
# (JWT_SIGNING_KEY) solo la recibe identity: con ella se forja cualquier sesion, y el
# gateway verifica con las claves publicas (JWT_PUBLIC_KEYS). Todo servicio nuevo lleva
# `JWT_SIGNING_KEY: ""`; ops/security/secrets/check-secrets.sh lo comprueba. Lo mismo vale para
# la llave de la cadena de hash de auditoria (AUDIT_HASH_KEY y AUDIT_HASH_KEYS_OLD): solo la recibe
# audit, y todo servicio nuevo lleva las dos vaciadas.
services:
  postgres-primary:
    image: pgvector/pgvector:pg16
    # Solo dev local. En produccion (AWS) la base vive en RDS y este contenedor no
    # arranca: levantalo con `docker compose --profile embedded-db up`.
    profiles: ["embedded-db"]
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    environment:
      TZ: ${TZ:-America/Lima}
      PGTZ: ${TZ:-America/Lima}
      POSTGRES_USER: mail_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_DB: mail_registry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_admin -d mail_registry"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  pgbouncer:
    # Fijada por digest: pgbouncer esta en el camino de TODA lectura y escritura. Con
    # :latest, un `pull` cualquiera cambiaria el pooler de la base sin que nadie lo revise.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    environment:
      TZ: ${TZ:-America/Lima}
      DB_UPSTREAM_HOST: ${DB_UPSTREAM_HOST:-postgres-primary}
      DB_UPSTREAM_PORT: ${DB_UPSTREAM_PORT:-5432}
      # verify-full salvo en development|test; el entrypoint rechaza algo mas debil fuera de ahi.
      DB_UPSTREAM_SSLMODE: ${DB_UPSTREAM_SSLMODE:-}
      ENVIRONMENT: ${ENVIRONMENT:-}
      # Solo development|test y sin userlist.txt montado: userlist efimero en /tmp del
      # contenedor con el rol de plataforma. En produccion el pooler exige el fichero.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      # El DIRECTORIO entero, no fichero a fichero: un bind de fichero ata el inodo y,
      # cuando alguien reemplaza userlist.txt en el host (cualquier editor o `sed -i`
      # escribe un temporal y lo renombra encima), el contenedor sigue leyendo el inodo
      # viejo para siempre. userlist.txt guarda credenciales en claro y lo lee el uid 70
      # del contenedor: modo 640 con grupo 70.
      - ./pgbouncer:/etc/pgbouncer:ro
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U mail_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      mail-internal:
        aliases:
          - postgres

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru --hz 20
    environment:
      TZ: ${TZ:-America/Lima}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  nats:
    image: nats:2.10-alpine
    # -m 8222 abre el monitor HTTP (/varz, /jsz, /connz). Sin el no hay forma de ver si
    # un consumidor de JetStream se quedo atascado. El puerto NO se publica al host.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    environment:
      TZ: ${TZ:-America/Lima}
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    # Solo en loopback: la unica entrada desde fuera es el proxy de borde (443), que
    # llega al gateway por la red interna. Publicarlo en 0.0.0.0 dejaria una puerta HTTP
    # en claro que solo taparia el grupo de seguridad.
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      # Los limites de peticiones se cuentan en Redis para todas las replicas; sin el, cada
      # replica cuenta en memoria (arranca igual, pero el cupo se multiplica).
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      access-control:
        condition: service_started
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  identity:
    build:
      context: .
      dockerfile: ./services/identity/Dockerfile
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8001}:8001"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  access-control:
    build:
      context: .
      dockerfile: ./services/access-control/Dockerfile
    ports:
      - "127.0.0.1:${ACCESS_CONTROL_PORT:-8002}:8002"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  organization:
    build:
      context: .
      dockerfile: ./services/organization/Dockerfile
    ports:
      - "127.0.0.1:${ORGANIZATION_PORT:-8003}:8003"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SIGNING_KEY: ""
      # Las migraciones viajan dentro de la imagen del servicio que las aplica.
      TENANT_MIGRATION_DIR: /app/migrations/tenant/canonical
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  audit:
    build:
      context: .
      dockerfile: ./services/audit/Dockerfile
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8030}:8030"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_audit
      TENANT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  scheduler:
    build:
      context: .
      dockerfile: ./services/scheduler/Dockerfile
    ports:
      - "127.0.0.1:${SCHEDULER_PORT:-8033}:8033"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_scheduler
      TENANT_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  mail-directory:
    build:
      context: .
      dockerfile: ./services/mail-directory/Dockerfile
    ports:
      - "127.0.0.1:${MAIL_DIRECTORY_PORT:-8040}:8040"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      CELL_DB_PASSWORD: ${CELL_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
      # La credencial de plataforma no llega a los servicios de celda: usan la de su celda
      # (secreto CELL_DB_PASSWORD). Solo en desarrollo, sin rol de celda, se les puede dar
      # la de plataforma con CELL_SERVICES_PLATFORM_PASSWORD; en produccion queda vacia.
      POSTGRES_PASSWORD: ${CELL_SERVICES_PLATFORM_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  mail-auth:
    build:
      context: .
      dockerfile: ./services/mail-auth/Dockerfile
    ports:
      - "127.0.0.1:${MAIL_AUTH_PORT:-8041}:8041"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      CELL_DB_PASSWORD: ${CELL_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
      # La credencial de plataforma no llega a los servicios de celda: usan la de su celda
      # (secreto CELL_DB_PASSWORD). Solo en desarrollo, sin rol de celda, se les puede dar
      # la de plataforma con CELL_SERVICES_PLATFORM_PASSWORD; en produccion queda vacia.
      POSTGRES_PASSWORD: ${CELL_SERVICES_PLATFORM_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      mail-internal: {}
      # Dovecot (deploy/mail) lo busca por MAIL_AUTH_URL en la red de los motores.
      mail-engines:
        aliases:
          - mail-auth

  mail-security:
    build:
      context: .
      dockerfile: ./services/mail-security/Dockerfile
    ports:
      - "127.0.0.1:${MAIL_SECURITY_PORT:-8042}:8042"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      CELL_DB_PASSWORD: ${CELL_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
      # La credencial de plataforma no llega a los servicios de celda: usan la de su celda
      # (secreto CELL_DB_PASSWORD). Solo en desarrollo, sin rol de celda, se les puede dar
      # la de plataforma con CELL_SERVICES_PLATFORM_PASSWORD; en produccion queda vacia.
      POSTGRES_PASSWORD: ${CELL_SERVICES_PLATFORM_PASSWORD:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      mail-internal: {}
      # Los motores (deploy/mail) lo buscan por MAIL_POLICY_HOST; el alias evita
      # tocar los ficheros de Rspamd copiados.
      mail-engines:
        aliases:
          - mail-policy

  webmail:
    build:
      context: .
      dockerfile: ./services/webmail/Dockerfile
    ports:
      - "127.0.0.1:${WEBMAIL_PORT:-8044}:8044"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      CELL_DB_PASSWORD: ${CELL_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
      # La credencial de plataforma no llega a los servicios de celda: usan la de su celda
      # (secreto CELL_DB_PASSWORD). Solo en desarrollo, sin rol de celda, se les puede dar
      # la de plataforma con CELL_SERVICES_PLATFORM_PASSWORD; en produccion queda vacia.
      POSTGRES_PASSWORD: ${CELL_SERVICES_PLATFORM_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      mail-internal: {}
      # Habla con dovecot (IMAP), postfix (submission), mail-auth y clamd por la red de los
      # motores. Esa red es mynetworks de Postfix: el webmail se autentica siempre para que
      # smtpd_sender_login_maps se aplique al buzon (deploy/mail/README.md, Webmail).
      mail-engines: {}

  domain-service:
    build:
      context: .
      dockerfile: ./services/domain-service/Dockerfile
    ports:
      - "127.0.0.1:${DOMAIN_SERVICE_PORT:-8043}:8043"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_domains
      TENANT_DB_PASSWORD: ${DOMAIN_SERVICE_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  # Trabajos de migracion de buzones desde otro proveedor (docs/adr/0002). Sirve dos listeners: la API
  # de administracion (8056, por el gateway) y la del ejecutor mail-migration-runner (8057, solo por la
  # red mail-migration, con MAIL_MIGRATION_RUNNER_KEY). Sin esa clave el listener del ejecutor no se abre.
  mail-migration:
    build:
      context: .
      dockerfile: ./services/mail-migration/Dockerfile
    ports:
      - "127.0.0.1:${MAIL_MIGRATION_PORT:-8056}:8056"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_mail_migration
      TENANT_DB_PASSWORD: ${MAIL_MIGRATION_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal
      - mail-migration

  # CardDAV: contactos personales de cada buzon (docs/adr/0004). Su usuario es un buzon: cada peticion se
  # autentica con HTTP Basic contra mail-auth (service "dav", por la red de los motores) y el gateway lo
  # expone como prefijo autenticado por el servicio. Sus datos viven en el esquema mail_dav de la base de cada
  # empresa. Basic solo es admisible porque el proxy de borde termina TLS antes del gateway.
  mail-dav:
    build:
      context: .
      dockerfile: ./services/mail-dav/Dockerfile
    ports:
      - "127.0.0.1:${MAIL_DAV_PORT:-8058}:8058"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_mail_dav
      TENANT_DB_PASSWORD: ${MAIL_DAV_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal
      # mail-auth (verificacion de la credencial del buzon) esta en la red de los motores.
      - mail-engines

  transactional:
    build:
      context: .
      dockerfile: ./services/transactional/Dockerfile
    ports:
      - "127.0.0.1:${TRANSACTIONAL_PORT:-8045}:8045"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_transactional
      TENANT_DB_PASSWORD: ${TRANSACTIONAL_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  suppression:
    build:
      context: .
      dockerfile: ./services/suppression/Dockerfile
    ports:
      - "127.0.0.1:${SUPPRESSION_PORT:-8046}:8046"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_suppression
      TENANT_DB_PASSWORD: ${SUPPRESSION_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  templates:
    build:
      context: .
      dockerfile: ./services/templates/Dockerfile
    ports:
      - "127.0.0.1:${TEMPLATES_PORT:-8047}:8047"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_templates
      TENANT_DB_PASSWORD: ${TEMPLATES_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  contacts:
    build:
      context: .
      dockerfile: ./services/contacts/Dockerfile
    ports:
      - "127.0.0.1:${CONTACTS_PORT:-8050}:8050"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${TENANT_SERVICES_PLATFORM_PASSWORD:-}
      REGISTRY_DB_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-}
      TENANT_DB_USER: mail_svc_contacts
      TENANT_DB_PASSWORD: ${CONTACTS_DB_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - mail-internal

  billing:
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    ports:
      - "127.0.0.1:${BILLING_PORT:-8055}:8055"
    env_file:
      - .env
      - path: /dev/shm/core-force-mail/secrets.env
        required: false
    environment:
      AUDIT_HASH_KEY: ""
      AUDIT_HASH_KEYS_OLD: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SIGNING_KEY: ""
    depends_on:
