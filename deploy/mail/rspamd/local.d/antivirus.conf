clamav {
  # Scan whole message
  scan_mime_parts = false;
  #scan_text_mime = true;
  #scan_image_mime = true;
  symbol = "CLAM_VIRUS";
  type = "clamav";
  log_clean = true;
  servers = "clamd:3310";
  # Mayor mensaje que se manda a clamd, en bytes. Con scan_mime_parts = false el modulo
  # compara este tope con el mensaje ENTERO (antivirus.lua pasa task:get_content(), no cada
  # parte), y uno mayor NO se analiza: common.lua registra "skip clamav check as it is too
  # large" en info, no deja ningun simbolo y el mensaje se entrega sin veredicto. Por eso
  # cubre message_size_limit de Postfix (104857600) mas 1 MiB, igual que max_message.
  # ops/scaffold/check-mail-size-limits.sh lo ata a Postfix y a clamd.conf.
  max_size = 105906176;
  # clamd analiza 101 MiB en menos de dos segundos con las firmas al dia; el defecto del
  # modulo (5 s) no cubre una cola de mensajes grandes. Queda por debajo del task_timeout
  # del worker (25 s, override.d/worker-normal.inc): agotarlo deja CLAM_VIRUS_FAIL, que
  # force_actions.conf convierte en soft reject, nunca en una entrega sin analizar.
  timeout = 15;
}
