# Core Force - tuning de kernel para hosts Docker (drop-in de /etc/sysctl.d/)
# Aplicado por ops/server-template/bootstrap.sh con "sysctl --system".

# Memoria: priorizar RAM, usar swap solo como red de seguridad.
vm.swappiness = 10
vm.overcommit_memory = 1

# Mapas de memoria por proceso (servicios con muchos hilos/segmentos).
vm.max_map_count = 262144

# Watchers de archivos: muchos contenedores observando el filesystem.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# Red: backlog de conexiones para el edge y los servicios.
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 1024 65535
