@version: 4.8
@include "scl.conf"
# Tope de POSTFIX_DELIVERY_LOG (docs/Plan_Registro_de_Envios.md): si mail-security no la lee, la lista
# no crece sin limite en el Redis que los motores consultan en cada mensaje.
@define delivery_log_max_lines "200000"
options {
  chain_hostnames(off);
  flush_lines(0);
  use_dns(no);
  dns_cache(no);
  use_fqdn(no);
  owner("root"); group("adm"); perm(0640);
  stats(freq(0));
  bad_hostname("^gconfd$");
};
source s_src {
  unix-stream("/dev/log");
  internal();
};
destination d_stdout { pipe("/dev/stdout"); };
destination d_redis_ui_log {
  redis(
    host("`MAIL_REDIS_HOST`")
    persist-name("redis1")
    port(6379)
    auth("`MAIL_REDIS_PASSWORD`")
    command("LPUSH" "POSTFIX_MAILLOG" "$(format-json time=\"$S_UNIXTIME\" priority=\"$PRIORITY\" program=\"$PROGRAM\" message=\"$MESSAGE\")\n")
  );
};
# Registro de entregas: las mismas lineas, en una lista con un solo lector (mail-security), que no se
# recorta para mirarla sino que se consume. LPUSH y LTRIM en un solo EVAL: atomico y sin otro proceso.
destination d_redis_delivery_log {
  redis(
    host("`MAIL_REDIS_HOST`")
    persist-name("redis3")
    port(6379)
    auth("`MAIL_REDIS_PASSWORD`")
    command("EVAL" "redis.call('LPUSH', KEYS[1], ARGV[1]); redis.call('LTRIM', KEYS[1], 0, tonumber(ARGV[2]) - 1); return 1" "1" "POSTFIX_DELIVERY_LOG" "$(format-json time=\"$S_UNIXTIME\" priority=\"$PRIORITY\" program=\"$PROGRAM\" message=\"$MESSAGE\")" "`delivery_log_max_lines`")
  );
};
destination d_redis_f2b_channel {
  redis(
    host("`MAIL_REDIS_HOST`")
    persist-name("redis2")
    port(6379)
    auth("`MAIL_REDIS_PASSWORD`")
    command("PUBLISH" "F2B_CHANNEL" "$(sanitize $MESSAGE)")
  );
};
filter f_mail { facility(mail); };
# start
# overriding warnings are still displayed when the entrypoint runs its initial check
# warnings logged by postfix-mail to syslog are hidden to reduce repeating msgs
# Some other warnings are ignored
filter f_ignore {
  not match("overriding earlier entry" value("MESSAGE"));
  not match("TLS SNI from checks.mailcow.email" value("MESSAGE"));
  not match("no SASL support" value("MESSAGE"));
  not facility (local0, local1, local2, local3, local4, local5, local6, local7);
};
# end
log {
  source(s_src);
  filter(f_ignore);
  destination(d_stdout);
  filter(f_mail);
  destination(d_redis_ui_log);
  destination(d_redis_delivery_log);
  destination(d_redis_f2b_channel);
};
