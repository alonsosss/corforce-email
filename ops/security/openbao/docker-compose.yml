# OpenBao, el almacen de secretos de la plataforma (docs/adr/0011-almacen-de-secretos-openbao.md).
#
# Proyecto propio (core-force-mail-openbao), fuera de docker-compose.yml: es de donde salen los
# secretos del resto, asi que no puede depender de with-secrets.sh para arrancar ni recrearse
# en un despliegue de la plataforma. Lo levanta y actualiza solo instalar.sh. No interpola
# ningun secreto: la llave de desbloqueo llega como fichero montado.
name: core-force-mail-openbao

services:
  openbao:
    # Fijada por digest: es la custodia de todas las credenciales.
    image: openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    container_name: ${OPENBAO_CONTENEDOR:-core-force-mail-openbao}
    command: ["server", "-config=/openbao/config/config.hcl"]
    # Red del host con listener en 127.0.0.1: ningun contenedor de la plataforma lo alcanza y las
    # credenciales AppRole quedan atadas a 127.0.0.1/32 (con puerto publicado llegarian desde la
    # IP de la puerta de enlace del bridge).
    network_mode: host
    # El usuario que despliega: es dueno de los datos y de la llave, sin root en ningun paso.
    user: "${OPENBAO_UID:?}:${OPENBAO_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BAO_ADDR: "http://127.0.0.1:${OPENBAO_PUERTO:?}"
      SKIP_SETCAP: "true"
    volumes:
      - ${OPENBAO_DATOS:?}:/openbao/data
      - ${OPENBAO_CONFIG:?}:/openbao/config:ro
      - ${OPENBAO_LLAVE:?}:/openbao/llave:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      # bao status sale con 0 solo si esta inicializado y desbloqueado.
      test: ["CMD", "bao", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    # La auditoria va a stdout: el registro del contenedor es el registro de accesos. Rotado para
    # no llenar el disco; promtail lo lleva a Loki.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
