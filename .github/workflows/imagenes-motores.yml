name: Vulnerabilidades de las imagenes de los motores

# Una vez al mes construye cada imagen de deploy/mail y la escanea con Trivy: solo gravedad critica o
# alta y solo con arreglo publicado. Mantiene UNA incidencia abierta mientras haya algo que corregir y la
# cierra cuando no queda nada. Solo lee: no despliega ni escribe en el repositorio. Los parches de los
# motores llegan al reconstruir la imagen (deploy/mail/UPSTREAM.md, seccion 9); ClamAV se compila, asi
# que el trabajo tarda.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: imagenes-motores
  cancel-in-progress: false

jobs:
  escanear:
    name: Escaneo de las imagenes de los motores
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Construir y escanear
        run: ops/security/escanear-motores.sh escanear resultados > informe.md

      - name: Resumen
        run: sed 1d informe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resultados de Trivy
        uses: actions/upload-artifact@v7
        with:
          name: trivy-motores
          path: resultados/*.json
          retention-days: 90

      - name: Incidencia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Quien atiende el mantenimiento (docs/Operacion_Despliegue.md, Mantenimiento): la variable de
          # repositorio MANTENIMIENTO_RESPONSABLE o, sin ella, el dueno del repositorio.
          RESPONSABLE: ${{ vars.MANTENIMIENTO_RESPONSABLE || github.repository_owner }}
        run: |
          set -euo pipefail
          read -r _ criticas altas < <(sed -n 's/^CORREGIBLES: /CORREGIBLES: /p' informe.md | head -1)
          # Un cuerpo de incidencia admite 65536 caracteres: se recorta por debajo.
          sed 1d informe.md | head -c 60000 > cuerpo.md
          numero="$(gh issue list --state open --label imagenes-motores --json number --jq '.[0].number // empty')"
          if [ "${criticas:-0}" -eq 0 ] && [ "${altas:-0}" -eq 0 ]; then
            echo "Sin vulnerabilidades criticas ni altas con arreglo."
            if [ -n "$numero" ]; then
              gh issue close "$numero" --comment "Sin vulnerabilidades criticas ni altas con arreglo publicado en las imagenes de los motores."
            fi
            exit 0
          fi
          gh label create imagenes-motores --color d93f0b --description "Vulnerabilidades con arreglo en las imagenes de los motores" 2>/dev/null || true
          titulo="Vulnerabilidades con arreglo en las imagenes de los motores: ${criticas:-0} criticas, ${altas:-0} altas"
          # Plazo comprometido (deploy/mail/UPSTREAM.md, seccion 9): 72 horas con alguna critica y 14 dias
          # con solo altas. Cuenta desde que se aviso: la apertura de la incidencia o, si la critica aparece
          # en una incidencia que hasta ahora no tenia ninguna, desde este informe.
          ahora="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          desde="$ahora"
          if [ -n "$numero" ]; then
            read -r abierta titulo_previo < <(gh issue view "$numero" --json createdAt,title --jq '.createdAt + " " + .title')
            desde="$abierta"
            if [ "${criticas:-0}" -gt 0 ] && printf '%s' "$titulo_previo" | grep -q ': 0 criticas'; then desde="$ahora"; fi
          fi
          if [ "${criticas:-0}" -gt 0 ]; then horas=72; gravedad="critica"; else horas=336; gravedad="alta"; fi
          limite="$(date -u -d "$desde + $horas hours" '+%Y-%m-%d %H:%M UTC')"
          { printf '**Plazo para desplegar el arreglo: %s** (%s horas desde %s por la gravedad mas alta, %s).\n\n' \
              "$limite" "$horas" "$desde" "$gravedad"
            cat cuerpo.md; } > cuerpo-plazo.md
          if [ -n "$numero" ]; then
            gh issue edit "$numero" --title "$titulo" --body-file cuerpo-plazo.md
          else
            numero="$(gh issue create --title "$titulo" --label imagenes-motores --body-file cuerpo-plazo.md | sed 's|.*/||')"
          fi
          gh issue edit "$numero" --add-assignee "$RESPONSABLE" ||
            echo "::warning::no se pudo asignar la incidencia $numero a $RESPONSABLE (define la variable MANTENIMIENTO_RESPONSABLE)"
