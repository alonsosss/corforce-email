<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sin conexión - Core Force Mail</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #1b3a6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1220;
          --surface: #161c2a;
          --text: #eef2f8;
          --muted: #a3aec2;
          --accent: #7ea3e6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 26rem;
        margin: 1rem;
        padding: 2rem;
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        background: var(--accent);
        color: var(--surface);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" width="56" height="56" alt="" />
      <h1>Sin conexión</h1>
      <p>
        No hay conexión con el servidor de correo. Cuando vuelva la conexión, recarga la página para
        seguir trabajando.
      </p>
      <a href="/webmail">Volver a intentar</a>
    </main>
  </body>
</html>
