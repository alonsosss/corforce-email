# Reglas de alerta de la plataforma. Cada una describe un sintoma observable, no una
# causa: la causa se investiga en los tableros. Las ventanas (`for`) son deliberadamente
# amplias para que un despliegue normal no dispare ruido.
#
# El envio de las alertas (correo, WhatsApp) se configura en Grafana como punto de
# contacto; hasta que existan credenciales SMTP reales las alertas se ven, pero no salen.
groups:
  - name: disponibilidad
    rules:
      - alert: ServicioCaido
        expr: up{job="mail-services"} == 0
        for: 3m
        labels:
          severidad: critica
        annotations:
          resumen: "El servicio {{ $labels.service }} no responde al recolector"
          detalle: "Sin respuesta en /metrics durante 3 minutos. Revisar 'docker compose ps {{ $labels.service }}' y sus logs."

      - alert: ServicioReiniciandose
        expr: changes(process_start_time_seconds{job="mail-services"}[15m]) > 3
        for: 5m
        labels:
          severidad: alta
        annotations:
          resumen: "El servicio {{ $labels.service }} se reinicia en bucle"
          detalle: "Mas de tres arranques en 15 minutos: normalmente una dependencia caida o una variable de entorno ausente."

  - name: version-desplegada
    rules:
      # El retroceso silencioso de version.
      #
      # El despliegue bueno compila en el PC y el servidor solo hace pull de ECR. Un
      # `docker compose build/up` ejecutado EN el servidor compila con la copia de
      # /opt/core-force-mail/app, que llega por rsync selectivo y puede estar atrasada: el
      # contenedor queda "Up", el despliegue parecio salir bien y dentro corre codigo
      # ANTERIOR al desplegado.
      #
      # Nadie se entera hasta que alguien abre la pantalla afectada, porque el unico que
      # compara -check-image-drift.sh- corre DENTRO del despliegue y un contenedor recreado
      # desde una imagen local minutos despues ya no tiene nada mirando.
      #
      # La ventana es amplia porque durante un despliegue el contenedor se recrea y la
      # metrica puede faltar un momento; diez minutos no los aguanta ningun despliegue.
      - alert: ServicioConImagenLocal
        expr: core_force_image_local == 1
        for: 10m
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.servicio }} corre una imagen compilada en el servidor, no la de ECR"
          detalle: "Puede estar ejecutando codigo anterior al desplegado sin ningun sintoma. Reponer con 'scripts/deploy-ecr.sh {{ $labels.servicio }}' desde el PC; NO recrearlo a mano en el servidor, que es lo que lo provoca."

      # Que la vigilancia deje de correr se ve igual que si todo estuviera bien: la metrica
      # simplemente se queda quieta. Por eso se alerta de su antiguedad y no solo de su valor.
      - alert: VigilanciaDeImagenesDetenida
        expr: time() - core_force_image_check_timestamp_seconds > 3600
        for: 15m
        labels:
          severidad: media
        annotations:
          resumen: "Nadie esta comprobando el origen de las imagenes desde hace mas de una hora"
          detalle: "El cron de ops/observability/report-image-source.sh dejo de publicar. Mientras tanto, un servicio puede retroceder de version sin que nada avise."

  - name: trafico
    rules:
      - alert: TasaDeErrorAlta
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} devuelve mas de 5% de errores de servidor"
          detalle: "Proporcion de respuestas 5xx sostenida durante 10 minutos."

      - alert: LatenciaAlta
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severidad: media
        annotations:
          resumen: "{{ $labels.service }} responde por encima de 2s en el percentil 95"
          detalle: "Suele preceder al agotamiento del pool de conexiones o a una consulta sin indice."

  - name: base-de-datos
    rules:
      # El agotamiento del pool no se ve como error: se ve como lentitud. Vigilarlo es la
      # diferencia entre enterarse por la metrica o por el cliente.
      - alert: PoolDeConexionesAlLimite
        expr: |
          pgx_pool_connections{state="acquired"} / pgx_pool_max_connections > 0.9
        for: 5m
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} usa mas del 90% del pool de {{ $labels.pool }}"
          detalle: "Con una base por empresa, revisar si el trafico crecio o si una consulta retiene conexiones."

      - alert: EsperaDeConexiones
        expr: rate(pgx_pool_acquire_waits_total[5m]) > 1
        for: 10m
        labels:
          severidad: media
        annotations:
          resumen: "{{ $labels.service }} espera por conexiones libres en {{ $labels.pool }}"
          detalle: "Adquisiciones que encontraron el pool vacio. Precede a PoolDeConexionesAlLimite."

  - name: seguridad
    rules:
      # Un pico de denegaciones efectivas es ambiguo por diseno: o alguien intenta lo que
      # no le toca, o un despliegue dejo un permiso sin sembrar. Ambas cosas hay que verlas.
      - alert: PicoDeDenegacionesRBAC
        expr: sum by (module) (rate(rbac_denials_total{enforced="true"}[10m])) > 0.2
        for: 10m
        labels:
          severidad: media
        annotations:
          resumen: "Denegaciones de escritura sostenidas en el modulo {{ $labels.module }}"
          detalle: "Contrastar con el rastro de auditoria: permiso mal sembrado tras un despliegue o acceso indebido."

  - name: host
    rules:
      - alert: DiscoCasiLleno
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 15m
        labels:
          severidad: critica
        annotations:
          resumen: "Menos del 15% de disco libre en el servidor"
          detalle: "Las imagenes y los logs son los consumidores habituales; hay poda programada en ops/maintenance."

      - alert: MemoriaCasiAgotada
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severidad: alta
        annotations:
          resumen: "Menos del 10% de memoria disponible en el servidor"
          detalle: "Con mas de cien contenedores en una sola maquina, esto termina en muertes por falta de memoria."

      - alert: CPUSaturada
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severidad: media
        annotations:
          resumen: "CPU del servidor por encima del 90% sostenido"
          detalle: "Contrastar con builds en curso; si es trafico real, toca separar servicios de maquina."

      # El hipervisor frena a una instancia t3 cuando agota sus creditos de CPU, y ese
      # freno se ve como tiempo "robado" (steal), no como carga ni como memoria: las
      # demas reglas de este grupo no lo distinguen. Del 7 al 29 de julio de 2026 la
      # instancia estuvo veintitres dias con el saldo en cero y nadie lo supo hasta
      # mirar CloudWatch en septiembre. Un 10% sostenido ya es freno real; el 21%
      # acumulado de aquel episodio se habria visto en la primera hora.
      - alert: RoboDeCPU
        expr: avg(rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.10
        for: 30m
        labels:
          severidad: alta
        annotations:
          resumen: "El hipervisor esta frenando la instancia (steal sostenido)"
          detalle: "Creditos de CPU agotados. Comprobar CPUCreditBalance desde el PC (docs/aws/RUNBOOK-ESCALADO-EC2.md); si es carga real, decidir entre modo unlimited (cobra) o subir de instancia."

      # Las tres reglas siguientes son los umbrales del runbook de escalado
      # (docs/aws/RUNBOOK-ESCALADO-EC2.md): avisan ANTES de que MemoriaCasiAgotada o
      # CPUSaturada disparen, con margen para ejecutar el cambio de instancia en frio.
      - alert: MemoriaDisponibleBaja
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.20
        for: 30m
        labels:
          severidad: media
        annotations:
          resumen: "Menos del 20% de memoria disponible sostenido media hora"
          detalle: "Aviso temprano del runbook de escalado: si ocurre en estado estable (sin builds), evaluar subir de instancia antes de que llegue MemoriaCasiAgotada."

      - alert: CargaSostenidaAlta
        expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1
        for: 30m
        labels:
          severidad: media
        annotations:
          resumen: "Cola de CPU sostenida: load15 por encima del numero de nucleos"
          detalle: "Normalizado por nucleo (sobrevive a un cambio de tipo de instancia). En estado estable indica que los procesos esperan CPU aunque el porcentaje no llegue al 90%."

      - alert: SwapActivo
        expr: rate(node_vmstat_pswpout[10m]) > 100
        for: 15m
        labels:
          severidad: alta
        annotations:
          resumen: "El servidor esta escribiendo a swap de forma sostenida"
          detalle: "Paginado de salida continuo: la RAM ya no alcanza y el rendimiento se degrada antes de cualquier OOM. Umbral del runbook de escalado."

  - name: chat
    rules:
      - alert: ChatDesalojaClientes
        expr: rate(realtime_clients_evicted_total[10m]) > 0.05
        for: 15m
        labels:
          severidad: alta
        annotations:
          resumen: "El tiempo real esta cerrando conexiones que no dan abasto"
          detalle: "Se cierra al cliente cuya cola de salida se llena para que reconecte y recargue: es el comportamiento correcto, pero de forma sostenida significa que la maquina va justa o que hay una difusion demasiado grande. Contrastar con realtime_connected_clients."

      - alert: ChatCercaDeSuTecho
        expr: realtime_connected_clients > 3000
        for: 15m
        labels:
          severidad: media
        annotations:
          resumen: "El tiempo real sostiene mas de 3.000 conexiones"
          detalle: "El techo medido en esta maquina son 6.000 con difusion por debajo del segundo. Pasada la mitad conviene decidir si se separa el servicio o se crece la instancia, antes de que lo decida la saturacion."

      # Un analizador caido no se distingue de un dia sin adjuntos: en los dos casos no
      # pasa nada visible. Lo que los separa es aceptar archivos y no resolver ninguno.
      # Los dos lados se agregan por servicio a proposito: el contador de resueltos
      # lleva la etiqueta 'result' y el de aceptados no, y 'and' exige que las
      # etiquetas coincidan exactamente. Sin agregar, la comparacion no casa nunca y
      # la alerta jamas se dispara -- comprobado consultando a Prometheus, porque
      # promtool valida la sintaxis pero no que la expresion pueda dar resultado.
      - alert: ChatAdjuntosSinRevisar
        expr: |
          sum by (service) (increase(chat_attachment_scans_registered_total[30m])) > 0
            and sum by (service) (increase(chat_attachment_scans_total[30m])) == 0
        for: 15m
        labels:
          severidad: alta
        annotations:
          resumen: "Se aceptan adjuntos y no se esta resolviendo ninguno"
          detalle: "El analizador de contenido no responde: los adjuntos quedan pendientes y no pueden descargarse (que es el lado seguro). Revisar 'docker compose ps clamav' y sus logs; el flujo duradero recuperara lo pendiente en cuanto vuelva."

      - alert: ChatAdjuntoRechazado
        expr: increase(chat_attachment_scans_total{result="infected"}[1h]) > 0
        labels:
          severidad: media
        annotations:
          resumen: "El analisis de contenido rechazo un adjunto del chat"
          detalle: "Alguien intento compartir un archivo con una firma conocida. El binario ya se retiro del almacenamiento y la descarga esta cerrada; el detalle esta en Configuracion > Archivos del chat."

      - alert: ChatAdjuntosSinPoderRevisar
        expr: increase(chat_attachment_scans_total{result="error"}[1h]) > 0
        labels:
          severidad: media
        annotations:
          resumen: "Hubo adjuntos que no se pudieron analizar"
          detalle: "Agotados los cinco intentos, quedan en 'error' y SI se entregan: un analizador roto no puede dejar a la empresa sin sus documentos. Conviene revisar por que fallo antes de que se acumulen."

  # Vigilar al vigilante. Un vigia de alertas caido se ve EXACTAMENTE igual que un
  # sistema sano: en los dos casos no llega ningun aviso. Estas reglas son las
  # unicas que distinguen "no pasa nada" de "no me estoy enterando de nada".
  - name: vigilancia
    rules:
      - alert: VigiaDeAlertasNoSeRegistra
        expr: absent(platform_alert_watcher_last_run_timestamp_seconds)
        for: 15m
        labels:
          severidad: critica
        annotations:
          resumen: "El vigia de alertas no publica ninguna senal de vida"
          detalle: "Sin la serie no hay forma de saber si las alertas llegan a alguien. Revisar que notification arranco con PROMETHEUS_URL y PLATFORM_TENANT_ID; sin esas dos variables el vigia queda apagado a proposito."

      - alert: VigiaDeAlertasParado
        expr: time() - platform_alert_watcher_last_run_timestamp_seconds > 600
        for: 5m
        labels:
          severidad: critica
        annotations:
          resumen: "El vigia de alertas lleva mas de diez minutos sin completar una vuelta"
          detalle: "Da la vuelta cada minuto. Si se detiene, las alertas siguen disparandose en el recolector pero no llegan a ninguna persona. Revisar los logs de notification."

      # Una alerta disparada que no encuentra a quien avisar es peor que no tenerla:
      # el sistema cree que aviso. Se reintenta sola, pero hay que saberlo.
      - alert: AlertasSinDestinatario
        expr: increase(platform_alerts_without_operators_total[30m]) > 0
        for: 5m
        labels:
          severidad: critica
        annotations:
          resumen: "Hay alertas disparadas y nadie a quien avisar"
          detalle: "El tenant de plataforma no tiene operadores activos. Los avisos se reintentan en cada vuelta, pero mientras tanto nadie se entera de nada. Revisar los usuarios del tenant de plataforma."

  # La pasarela es la unica puerta de entrada de la plataforma: por ahi pasa TODO. Las reglas
  # genericas ya la cubren, pero con el umbral de un servicio cualquiera. Un 2% de
  # errores aqui significa que a una de cada cincuenta personas se le esta cayendo la
  # aplicacion, y eso no puede esperar diez minutos para avisar.
  - name: parcheado_del_host
    rules:
      - alert: ReinicioPendienteHaceDemasiado
        expr: |
          core_force_reinicio_pendiente == 1
          and
          time() - core_force_reinicio_pendiente_desde_timestamp_seconds > 1209600
        for: 1h
        labels:
          severidad: alta
        annotations:
          resumen: "Hay parches de seguridad esperando un reinicio desde hace mas de dos semanas"
          detalle: "El host tiene paquetes instalados que no protegen hasta reiniciar (kernel, libc6 o systemd). Con Livepatch los CVE criticos del kernel se aplican en caliente, pero libc6 y los saltos de version no. Revisar /var/run/reboot-required.pkgs y planificar la ventana; el reinicio automatico corre a la 01:00 de Lima."

      - alert: EstadoDelHostNoSeRegistra
        expr: absent(core_force_reinicio_pendiente)
        for: 6h
        labels:
          severidad: media
        annotations:
          resumen: "El estado de parcheado del host no publica ninguna serie"
          detalle: "Sin la serie, la alerta de reinicio pendiente no puede dispararse: quedaria vigilando algo que no existe. Comprobar 'systemctl status coreforce-estado-host.timer' y que pueda escribir en /opt/core-force-mail/metrics."

      - alert: VerificacionDeArranqueFallida
        expr: core_force_job_last_exit_code{trabajo="verificacion_arranque"} != 0
        for: 5m
        labels:
          severidad: critica
        annotations:
          resumen: "El sistema no volvio entero despues del ultimo arranque"
          detalle: "La verificacion posterior al arranque encontro contenedores caidos, enfermos o la pasarela sin responder, y no pudo arreglarlo. Revisar /var/log/core-force-mail-verificacion-arranque.log en el servidor. Nota: si el que no volvio fue Prometheus, esta alerta NO puede sonar y el aviso llega por el vigilante externo."

  - name: limites-de-peticiones
    rules:
      # Sin Redis cada replica cuenta el cupo en su propia memoria: el servicio sigue
      # atendiendo, pero con N replicas un cliente obtiene N veces su cupo, tambien en el
      # inicio de sesion. Un reinicio breve de Redis no avisa: la ventana es de 10 minutos.
      - alert: LimitadorSinRedis
        expr: sum by (service, limiter) (rate(rate_limit_degraded_total[5m])) > 0
        for: 10m
        labels:
          severidad: alta
        annotations:
          resumen: "El limitador {{ $labels.limiter }} de {{ $labels.service }} cuenta en memoria"
          detalle: "Redis no responde al limitador desde hace 10 minutos: cada replica aplica el cupo por su cuenta y el total se multiplica por el numero de replicas, tambien en el inicio de sesion. Revisar Redis y la red del servicio."

  - name: celdas
    rules:
      # Un servicio de celda solo recibe una empresa de otra celda si alguien la envio a la
      # instancia equivocada: el gateway sin GATEWAY_BASE_CELL_CODE con una segunda celda
      # registrada, un <SERVICIO>_CELL_HOSTS cruzado u otro servicio que llama a una sola
      # instancia para todas las celdas. El servicio la rechaza sin escribir nada, pero esa
      # empresa no puede operar hasta que se corrija el despliegue: avisa al primer rechazo.
      - alert: EmpresaEnCeldaAjena
        expr: sum by (service) (increase(cell_membership_refusals_total{reason="foreign_tenant"}[10m])) > 0
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} rechaza peticiones de empresas de otra celda"
          detalle: "Una empresa de otra celda llego a esta instancia y recibio 403 TENANT_NOT_IN_CELL. Revisar GATEWAY_BASE_CELL_CODE y <SERVICIO>_CELL_HOSTS del gateway y las URL de servicio de celda de quien llama (domain-service), y el registro del servicio (tenant_id y tenant_cell)."

      # cell_routing_failures_total (gateway) y cell_call_failures_total (domain-service) llevan
      # el servicio de celda de destino en 'cell_service'; 'service' lo pone el recolector y es
      # quien no pudo llamar.
      #
      # Una celda sin instancia declarada de un servicio es un error de despliegue que no se
      # corrige solo: la empresa no llega a ninguna instancia. Avisa al primer fallo. Los dos
      # crean sus series a cero al arrancar, una por servicio de celda y motivo que pueden
      # producir, asi que el primer fallo da increase().
      - alert: CeldaSinInstancia
        expr: |
          sum by (service, cell_service) (increase(cell_routing_failures_total{reason="not_served"}[10m])) > 0
            or sum by (service, cell_service) (increase(cell_call_failures_total{reason="not_served"}[10m])) > 0
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} no encuentra instancia de {{ $labels.cell_service }} en la celda de una empresa"
          detalle: "Esa celda no tiene instancia declarada de {{ $labels.cell_service }}: por el gateway sus empresas reciben 503 CELL_UNAVAILABLE y en domain-service su activacion de dominios y su entrega DKIM fallan en cada barrido. Declararla en <SERVICIO>_CELL_HOSTS, junto a GATEWAY_BASE_CELL_CODE, en el gateway y en domain-service, que leen las mismas variables; el registro de {{ $labels.service }} nombra la empresa y la celda."

      # domain-service elige la instancia de cada empresa con las mismas variables que el
      # gateway. Si la instancia responde TENANT_NOT_IN_CELL, su mapa de celdas no casa con el
      # CELL_CODE de la instancia: deriva de configuracion que no se corrige sola, al primer
      # rechazo. Si la instancia lo cuenta como foreign_tenant, EmpresaEnCeldaAjena suena a la
      # vez; esta dice quien la envio.
      - alert: MapaDeCeldasDesalineado
        expr: sum by (service, cell_service) (increase(cell_call_failures_total{reason="not_in_cell"}[10m])) > 0
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} envia empresas a una instancia de {{ $labels.cell_service }} que no es de su celda"
          detalle: "La instancia respondio 403 TENANT_NOT_IN_CELL y no se escribio nada, pero los pasos de dominios y DKIM de esa empresa fallan hasta corregirlo. Comparar GATEWAY_BASE_CELL_CODE, <SERVICIO>_CELL_HOSTS y los destinos base (MAIL_DIRECTORY_URL, MAIL_SECURITY_URL) de {{ $labels.service }} con los del gateway y con el CELL_CODE y ORGANIZATION_URL de cada instancia; el registro de {{ $labels.service }} nombra la empresa y la celda."

      # Sin respuesta de organization el gateway sirve la ultima celda conocida hasta una hora
      # despues de caducar (pkg/tenantcell): un reinicio o un corte breve solo falla a las
      # empresas sin cache y a quien corta la peticion durante la consulta. Con ventana de diez
      # minutos y quince de espera avisa cuando los fallos duran mas de cinco, mas que un
      # despliegue de organization, y tolera huecos de diez minutos entre peticiones de empresas
      # sin cache, que con poco trafico son escasas.
      - alert: ResolucionDeCeldaFallida
        expr: sum by (service, cell_service) (increase(cell_routing_failures_total{reason="unresolved"}[10m])) > 0
        for: 15m
        labels:
          severidad: alta
        annotations:
          resumen: "{{ $labels.service }} no obtiene de organization la celda de las empresas para {{ $labels.cell_service }}"
          detalle: "Fallos sostenidos al resolver la celda: las empresas sin celda en cache reciben 503 CELL_UNAVAILABLE y, una hora despues de caducar su ultima respuesta, todas. Revisar organization (ServicioCaido), ORGANIZATION_HOST y el token interno del gateway y la red entre los dos; cell_resolution_stale_total cuenta las resoluciones servidas con la ultima celda conocida."

      # domain-service no llama de forma continua: un barrido cada DOMAIN_RECHECK_INTERVAL (6 h
      # por defecto) y las acciones de las personas. De un barrido al siguiente su cache ya ha
      # caducado, asi que un corte de organization durante uno falla sus pasos, que el siguiente
      # repite: un barrido fallido no avisa. La ventana supera el intervalo y la espera supera
      # la ventana: avisa con fallos en dos barridos seguidos o sostenidos mas de media hora.
      # domain-service no arranca con DOMAIN_RECHECK_INTERVAL por encima de 6 h: alargarlo exige
      # alargar las dos y ese techo (maxRecheckInterval, services/domain-service/main.go).
      - alert: BarridoDeDominiosSinCelda
        expr: sum by (service, cell_service) (increase(cell_call_failures_total{reason="unresolved"}[6h30m])) > 0
        for: 7h
        labels:
          severidad: media
        annotations:
          resumen: "{{ $labels.service }} no obtiene de organization la celda de las empresas en barridos seguidos para {{ $labels.cell_service }}"
          detalle: "Sin la celda no sale ninguna llamada: la activacion de dominios, la entrega y retirada de claves DKIM y las desactivaciones pendientes esperan al barrido siguiente, y las verificaciones de las personas devuelven integration_errors. Revisar organization, ORGANIZATION_URL y el token interno de domain-service y la red entre los dos."

      # Solo el superadmin nombra otra celda en X-Target-Cell y ningun cliente legitimo la
      # manda sin ese rol (la web no la manda nunca): el rechazo es alguien con una sesion
      # valida de una empresa tanteando el aislamiento entre celdas, o una sesion robada. El
      # gateway respondio 403 sin salir hacia ninguna celda, pero hay una cuenta que revisar:
      # al primer intento y con severidad alta.
      - alert: CeldaDestinoSinSuperadmin
        expr: sum by (service) (increase(cell_target_refusals_total{reason="not_operator"}[10m])) > 0
        labels:
          severidad: alta
        annotations:
          resumen: "Una sesion sin rol superadmin intento operar otra celda con X-Target-Cell"
          detalle: "El gateway la rechazo con 403 TARGET_CELL_FORBIDDEN sin enviarla a ninguna celda. Ningun cliente legitimo manda esa cabecera sin el rol superadmin: el registro del gateway (celda destino rechazada, not_operator) y el rastro de auditoria (target_cell) dicen que cuenta, de que empresa y en que ruta. Si no tiene explicacion, revocar sus sesiones."

  # Repaso de las claves DKIM de los motores en mail-security: al arrancar y cada
  # MAIL_DKIM_RECONCILE_INTERVAL (15 min por defecto), con el cerrojo de la base de la celda, retira
  # las claves que la regla ya impide al escribir y con los eventos del directorio. Nada de esto
  # corta el correo: severidad media en las tres.
  - name: claves-dkim
    rules:
      # Cada retirada es un camino que fallo antes. not_served: un dominio inactivo o fuera del
      # directorio conservaba claves (una caida entre dos pasos, un evento mail.domain.* que no
      # llego). tenant_gone: un dominio activo de una empresa que organization ya no conoce (la baja
      # no desactivo sus dominios, que siguen recibiendo). Las claves ya se retiraron: avisa al
      # primer caso y lo deja una hora a la vista para investigarlo. Las series nacen a cero y la
      # del mismo objetivo sigue tras un reinicio, asi que tambien cuenta lo que retire la pasada con
      # la que arranca el proceso; solo en el primer despliegue, sin serie previa, lo que retire al
      # arrancar puede no avisar, y es la limpieza esperada de ese despliegue.
      - alert: ClavesDKIMRetiradasPorElRepaso
        expr: sum by (service, reason) (increase(mail_security_dkim_reconcile_removals_total[1h])) > 0
        labels:
          severidad: media
        annotations:
          resumen: "El repaso DKIM de {{ $labels.service }} retiro claves de dominios que la celda no debia firmar ({{ $labels.reason }})"
          detalle: "Las claves ya no estan en los motores, pero un camino fallo antes. not_served: el dominio no esta activo en el directorio de la celda y conservaba claves (una caida entre dos pasos o un evento mail.domain.* que no llego a mail-security). tenant_gone: el dominio sigue activo en el directorio y organization ya no conoce su empresa, asi que la baja no desactivo sus dominios, que siguen recibiendo correo. El registro de {{ $labels.service }} (repaso DKIM) nombra cada dominio y su empresa."

      # Cada pasada tiene de plazo un intervalo y una que no termina (Redis de los motores, la base
      # de la celda, el plazo) se repite en la siguiente. El umbral son cuatro intervalos y la
      # espera uno mas: avisa cuando cuatro pasadas seguidas no terminaron, tambien la que aun podia
      # estar en curso. El cerrojo es por pasada y cualquier replica repasa la celda entera: vale la
      # pasada mas reciente de las replicas del servicio, y la que no completo ninguna cuenta desde
      # su arranque, que asi tiene el mismo margen. Mientras dure, nadie retira lo que un camino
      # fallido deje en los motores. Cuenta con MAIL_DKIM_RECONCILE_INTERVAL: si se alarga, hay que
      # alargar el umbral (cuatro intervalos) y la espera (uno).
      - alert: RepasoDKIMDetenido
        expr: |
          time() - max by (service) (
              mail_security_dkim_reconcile_last_success_timestamp_seconds > 0
            or on (job, service, instance)
              (process_start_time_seconds and on (job, service, instance) mail_security_dkim_reconcile_last_success_timestamp_seconds)
          ) > 3600
        for: 15m
        labels:
          severidad: media
        annotations:
          resumen: "El repaso DKIM de {{ $labels.service }} no completa ninguna pasada desde hace mas de una hora"
          detalle: "Las pasadas fallan o no terminan en su plazo, asi que nadie retira las claves DKIM que un camino fallido deje en los motores; publicar y retirar claves y los eventos del directorio siguen funcionando. El registro de {{ $labels.service }} (repaso DKIM incompleto) dice por que: Redis de los motores, la base de la celda o una pasada mas larga que MAIL_DKIM_RECONCILE_INTERVAL."

      # Sin respuesta de organization el repaso conserva las claves de esas empresas: una pasada asi
      # no avisa y la siguiente lo repite. El resolvedor sirve la ultima respuesta hasta una hora
      # despues de caducar, asi que esto sube con un corte largo o con un proceso recien arrancado
      # sin cache. La ventana supera un intervalo, para que las pasadas seguidas la mantengan, y la
      # espera son cuatro: avisa cuando cuatro pasadas seguidas no obtienen la empresa de algun
      # dominio. organization caido ya avisa (ServicioCaido); esta cubre que mail-security no llegue
      # a el. Cuenta con MAIL_DKIM_RECONCILE_INTERVAL: si se alarga, hay que alargar la ventana (mas
      # de un intervalo) y la espera (cuatro).
      - alert: RepasoDKIMSinOrganization
        expr: sum by (service) (increase(mail_security_dkim_reconcile_unresolved_total[20m])) > 0
        for: 1h
        labels:
          severidad: media
        annotations:
          resumen: "El repaso DKIM de {{ $labels.service }} no obtiene de organization la empresa de sus dominios"
          detalle: "Las claves de las empresas sin respuesta se conservan, tambien las de una empresa ya dada de baja. La segunda barrera de la celda pregunta a organization por la misma ruta y rechaza con 503 a las empresas que no tiene en cache. Revisar organization, ORGANIZATION_URL y el token interno de {{ $labels.service }} y la red entre los dos."
