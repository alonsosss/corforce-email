# Recuperacion cuando un kernel nuevo no arranca.
#
# La imagen de AWS deja GRUB mudo y sin espera: GRUB_TERMINAL=console (no habla
# por el puerto serie), GRUB_TIMEOUT=0 y, lo mas grave, GRUB_RECORDFAIL_TIMEOUT=0,
# que desactiva la red de seguridad de Ubuntu para "el arranque anterior fallo".
# Con eso, un kernel que no arranca deja la maquina en bucle sin forma de entrar:
# la unica salida seria desconectar el disco y montarlo en otra instancia.
#
# Importa desde que los parches se aplican solos y el reinicio es desatendido.
#
# No se toca 50-cloudimg-settings.cfg a proposito: es de la imagen y una
# actualizacion lo reescribiria. Los ficheros de este directorio se leen en orden
# alfabetico, asi que el 99 manda.

# GRUB tambien por el puerto serie. El kernel ya lo hacia (console=ttyS0 en la
# linea de arranque), pero el menu de GRUB no se veia: se podia mirar como fallaba
# y no elegir el kernel anterior.
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"

# La espera SOLO cuando el arranque anterior fallo. Un arranque normal sigue sin
# menu y sin un segundo de retraso; el medio minuto aparece justo el dia que hace
# falta, que es el unico dia en que alguien va a estar mirando la consola serie.
GRUB_RECORDFAIL_TIMEOUT=30
